<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14110b">
<title>Control de presentación</title>
<style>
  :root { --bg:#14110b; --panel:#1f1a11; --ink:#fff7e8; --muted:#b9ab92; --accent:#f9b34c; --ok:#4ade80; --bad:#f87171; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  #status { font-size:13px; color:var(--muted); flex:1; }
  #timer { font-variant-numeric:tabular-nums; font-size:16px; padding:6px 12px; border-radius:999px; background:#ffffff14; border:0; color:var(--ink); }
  #timer.run { background:#f9b34c33; }
  main { flex:1; overflow:auto; padding:0 14px 8px; -webkit-overflow-scrolling:touch; }
  #thumb { width:100%; aspect-ratio:16/9; object-fit:contain; background:#000; border-radius:12px; display:block; }
  #meta { display:flex; justify-content:space-between; align-items:baseline; margin:10px 2px 6px; gap:10px; }
  #title { font-weight:700; font-size:17px; line-height:1.25; }
  #pos { color:var(--muted); font-size:14px; white-space:nowrap; }
  #next { color:var(--muted); font-size:13px; margin:0 2px 8px; }
  #notes { background:var(--panel); border-radius:14px; padding:14px 16px; font-size:19px; line-height:1.5; }
  #notes p { margin:0 0 12px; } #notes p:last-child { margin:0; }
  #notes .empty { color:var(--muted); font-size:15px; }
  #jump { margin:12px 0; display:none; grid-template-columns:repeat(3,1fr); gap:8px; }
  #jump.open { display:grid; }
  #jump button { border:0; padding:0; background:#000; border-radius:8px; overflow:hidden; position:relative; aspect-ratio:16/9; }
  #jump img { width:100%; height:100%; object-fit:cover; display:block; opacity:.85; }
  #jump span { position:absolute; left:4px; bottom:2px; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 3px #000; }
  #jump button.cur { outline:3px solid var(--accent); }
  footer { display:grid; grid-template-columns:1fr 2fr; gap:10px; padding:10px 14px 14px; }
  .nav { border:0; border-radius:20px; font-size:22px; font-weight:800; padding:26px 8px; color:var(--ink); background:#ffffff1f; touch-action:manipulation; }
  .nav.next { background:var(--accent); color:#2a1a00; }
  .nav:active { transform:scale(.97); filter:brightness(1.1); }
  .tools { display:flex; gap:8px; padding:0 14px 6px; }
  .tools button { flex:1; border:0; border-radius:12px; padding:11px 6px; font-size:14px; background:#ffffff14; color:var(--ink); }
  #setup { position:fixed; inset:0; background:var(--bg); z-index:10; display:none; flex-direction:column; justify-content:center; gap:12px; padding:28px; }
  #setup.show { display:flex; }
  #setup input { font-size:18px; padding:14px; border-radius:12px; border:1px solid #ffffff33; background:var(--panel); color:var(--ink); }
  #setup button { border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:700; background:var(--accent); color:#2a1a00; }
  #setup p { color:var(--muted); line-height:1.5; margin:0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><span id="status">Conectando…</span>
  <button id="timer" title="Toca para iniciar o pausar; mantén para reiniciar">⏱ 0:00</button>
</header>

<main>
  <img id="thumb" alt="Diapositiva actual">
  <div id="meta"><div id="title">—</div><div id="pos"></div></div>
  <div id="next"></div>
  <div id="notes"><p class="empty">Esperando al iPad…</p></div>
  <div id="jump"></div>
</main>

<div class="tools">
  <button id="btnBlank">⬛ Pantalla negra</button>
  <button id="btnJump">🔢 Ir a…</button>
  <button id="btnSync">🔄 Sincronizar</button>
</div>
<footer>
  <button class="nav" id="btnPrev">◀ Atrás</button>
  <button class="nav next" id="btnNext">Siguiente ▶</button>
</footer>

<div id="setup">
  <h2 style="margin:0">Sala de la presentación</h2>
  <p>Escribe el código de sala que aparece en el iPad (o escanea el QR de la pantalla inicial).</p>
  <input id="roomInput" placeholder="p. ej. k3m9x2qa7b" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="btnJoin">Conectar</button>
</div>

<script>window.SR_DECK=[{"title": "EFECTO INVERNADERO: EXPERIMENTOS DE LABORATORIO", "steps": ["01-0.jpg"], "notes": []}, {"title": "CONTENIDO", "steps": ["02-0.jpg"], "notes": []}, {"title": "¿QUÉ ES EL EFECTO INVERNADERO?", "steps": ["03-0.jpg"], "notes": ["Los gases de efecto invernadero son los que permiten que la Tierra se mantenga caliente. La atmósfera está compuesta en su mayoría por nitrógeno y oxígeno, que juntos son casi el 99% del aire, pero esos no son gases de efecto invernadero.", "El pequeño porcentaje restante incluye el vapor de agua, el dióxido de carbono, el metano y el óxido nitroso: esos sí son los gases responsables del efecto invernadero.", "Estos gases dejan pasar la luz visible del Sol, por eso no los vemos, pero cuando la Tierra libera ese calor de vuelta hacia el espacio en forma de radiación infrarroja, estos gases lo atrapan y lo devuelven a la superficie. Así, la energía del Sol llega a un nivel conveniente para la vida.", "Si no existieran los gases de efecto invernadero, la temperatura promedio de la Tierra bajaría a unos 15 grados bajo cero, en vez de los 15 grados que tenemos hoy: una diferencia de unos 30 grados. Por eso, estos gases son necesarios."]}, {"title": "¿CÓMO OCURRE EL EFECTO INVERNADERO?", "steps": ["04-0.jpg"], "notes": ["Ahora bien: después de la Revolución Industrial se ha producido muchísimo más gas de efecto invernadero, sobre todo dióxido de carbono. Y entre más gases hay en la atmósfera, más capacidad tiene esta de atrapar calor, así que la temperatura del planeta puede seguir subiendo.", "Un ejemplo extremo lo tenemos en el sistema solar: Venus. Su atmósfera tiene tantísimo dióxido de carbono que su superficie alcanza más de 400 grados Celsius. Es el planeta más caliente del sistema solar, aunque Mercurio está más cerca del Sol.", "Las principales causas de que la Tierra se esté calentando más de lo natural son la quema de combustibles fósiles, la deforestación de los bosques y el crecimiento de la población, que ha aumentado mucho la demanda de energía y recursos en las últimas décadas.", "Con esto termino mi parte; a continuación mis compañeros explican el experimento que hicimos para comprobarlo."]}, {"title": "EXPERIMENTO 1", "steps": ["05-0.jpg"], "notes": []}, {"title": "PROCEDIMIENTO — EXPERIMENTO 1", "steps": ["06-0.jpg", "06-1.jpg", "06-2.jpg", "06-3.jpg"], "notes": []}, {"title": "Tiempo", "steps": ["07-0.jpg"], "notes": []}, {"title": "EXPERIMENTO 1: ANÁLISIS (GALILEA)", "steps": ["08-0.jpg", "08-1.jpg", "08-2.jpg", "08-3.jpg"], "notes": []}, {"title": "¡JUEGO INTERACTIVO 1!", "steps": ["09-0.jpg"], "notes": []}, {"title": "EXPERIMENTO 2", "steps": ["10-0.jpg"], "notes": []}, {"title": "¿QUÉ ES EL CO2 Y CÓMO SE PRODUCE?", "steps": ["11-0.jpg", "11-1.jpg", "11-2.jpg", "11-3.jpg"], "notes": []}, {"title": "¿CÓMO SE PRODUCE EL CO2 EN ESTE EXPERIMENTO?", "steps": ["12-0.jpg"], "notes": []}, {"title": "Tiempo", "steps": ["13-0.jpg"], "notes": []}, {"title": "EXPERIMENTO 2: ANÁLISIS (MELANY)", "steps": ["14-0.jpg", "14-1.jpg", "14-2.jpg", "14-3.jpg"], "notes": []}, {"title": "¡JUEGO INTERACTIVO 2!", "steps": ["15-0.jpg"], "notes": []}, {"title": "CONCLUSIÓN GENERAL", "steps": ["16-0.jpg"], "notes": []}, {"title": "RECOMENDACIONES", "steps": ["17-0.jpg", "17-1.jpg", "17-2.jpg", "17-3.jpg"], "notes": []}, {"title": "BIBLIOGRAFÍA", "steps": ["18-0.jpg"], "notes": []}, {"title": "GLOSARIO DE TÉRMINOS", "steps": ["19-0.jpg"], "notes": []}, {"title": "¡Gracias!", "steps": ["20-0.jpg"], "notes": []}];</script>
<script>/* Slide Remote — lógica compartida (visor del iPad y control del celular) */
(function (g) {
  'use strict';
  var DEFAULT_RELAY = 'https://ntfy.sh';

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function rand(n) {
    var chars = 'abcdefghjkmnpqrstuvwxyz23456789', out = '', a = new Uint8Array(n);
    (g.crypto || g.msCrypto).getRandomValues(a);
    for (var i = 0; i < n; i++) out += chars[a[i] % chars.length];
    return out;
  }
  function cleanRoom(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40); }

  function getRelayBase() {
    var q = new URLSearchParams(location.search).get('relay');
    if (q) safeSet('sr_relay', q.replace(/\/+$/, ''));
    return safeGet('sr_relay') || DEFAULT_RELAY;
  }
  function getRoom(preferred) {
    var r = cleanRoom(preferred) || cleanRoom(safeGet('sr_room'));
    if (!r) r = rand(10);
    safeSet('sr_room', r);
    return r;
  }
  function setRoom(r) { r = cleanRoom(r); if (r.length >= 6) safeSet('sr_room', r); return r; }

  // Posición = [slide, paso]. Los pasos son los "clics" de aparición de cada slide.
  function advance(deck, pos, dir) {
    var i = pos[0], k = pos[1];
    if (dir > 0) {
      if (k < deck[i].steps.length - 1) return [i, k + 1];
      if (i < deck.length - 1) return [i + 1, 0];
      return [i, k];
    }
    if (k > 0) return [i, k - 1];
    if (i > 0) return [i - 1, deck[i - 1].steps.length - 1];
    return [i, k];
  }
  function clampPos(deck, pos) {
    var i = Math.max(0, Math.min(deck.length - 1, pos[0] | 0));
    var k = Math.max(0, Math.min(deck[i].steps.length - 1, pos[1] | 0));
    return [i, k];
  }
  function samePos(a, b) { return a && b && a[0] === b[0] && a[1] === b[1]; }

  function Relay(room) {
    this.room = room;
    this.url = getRelayBase() + '/wpdeck-' + room;
    this.me = rand(8);
    this.seen = {};
    this.onMessage = function () {};
    this.onStatus = function () {};
    this.status = 'connecting';
  }
  Relay.prototype._set = function (s) { if (s !== this.status) { this.status = s; this.onStatus(s); } };
  Relay.prototype.connect = function () {
    var self = this;
    if (self.es) { try { self.es.close(); } catch (e) {} }
    var es = new EventSource(self.url + '/sse');
    self.es = es;
    es.addEventListener('open', function () { self._set('ok'); });
    es.onerror = function () { self._set('retry'); };
    es.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m || m.event !== 'message') return;
      if (m.id) { if (self.seen[m.id]) return; self.seen[m.id] = 1; }
      if (m.time && Math.abs(Date.now() / 1000 - m.time) > 30) return; // ignora mensajes viejos
      var body = null;
      try { body = JSON.parse(m.message); } catch (e) { body = null; }
      if (!body || typeof body !== 'object') body = { c: String(m.message || '').trim().toLowerCase() };
      if (body.f && body.f === self.me) return; // eco propio
      self.onMessage(body);
    };
  };
  Relay.prototype.send = function (msg) {
    var self = this;
    msg.f = self.me;
    return fetch(self.url, { method: 'POST', body: JSON.stringify(msg) })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); self._set('ok'); return true; })
      .catch(function () { self._set('error'); return false; });
  };

  function keepAwake() {
    var lock = null;
    function req() {
      if (!('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {});
    }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') req(); });
    req();
  }

  function loadDeck() { if (window.SR_DECK) return Promise.resolve(window.SR_DECK); return fetch('deck.json').then(function (r) { return r.json(); }).then(function (d) { return d.slides; }); }

  g.SR = { rand: rand, getRoom: getRoom, setRoom: setRoom, cleanRoom: cleanRoom, getRelayBase: getRelayBase,
           advance: advance, clampPos: clampPos, samePos: samePos, Relay: Relay, keepAwake: keepAwake, loadDeck: loadDeck,
           thumb: function (deck, i) { var s = deck[i].steps; return s[s.length - 1]; } };
})(window);
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var deck = [], pos = [0, 0], blank = false, relay, room, gotState = false;
  var tStart = 0, tAcc = 0, tTimer = null, holdT;

  function fmt(ms) { var s = Math.floor(ms / 1000), m = Math.floor(s / 60); return m + ':' + ('0' + (s % 60)).slice(-2); }
  function tick() { $('timer').textContent = '⏱ ' + fmt(tAcc + (tStart ? Date.now() - tStart : 0)); }
  function timerToggle() {
    if (tStart) { tAcc += Date.now() - tStart; tStart = 0; clearInterval(tTimer); $('timer').classList.remove('run'); }
    else { tStart = Date.now(); tTimer = setInterval(tick, 500); $('timer').classList.add('run'); }
    tick();
  }
  $('timer').addEventListener('pointerdown', function () { holdT = setTimeout(function () { holdT = null; tAcc = 0; tStart = 0; clearInterval(tTimer); $('timer').classList.remove('run'); tick(); buzz(40); }, 700); });
  $('timer').addEventListener('pointerup', function () { if (holdT) { clearTimeout(holdT); holdT = null; timerToggle(); } });
  $('timer').addEventListener('pointerleave', function () { clearTimeout(holdT); holdT = null; });

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function render() {
    var s = deck[pos[0]];
    $('thumb').src = SR.thumb(deck, pos[0]);
    $('title').textContent = s.title || ('Diapositiva ' + (pos[0] + 1));
    $('pos').textContent = (pos[0] + 1) + '/' + deck.length + (s.steps.length > 1 ? ' · clic ' + (pos[1] + 1) + '/' + s.steps.length : '');
    var nx = deck[pos[0] + 1];
    $('next').textContent = s.steps.length > 1 && pos[1] < s.steps.length - 1 ? 'Siguiente clic: aparece el bloque ' + (pos[1] + 2) : (nx ? 'Sigue: ' + (nx.title || 'Diapositiva ' + (pos[0] + 2)) : 'Última diapositiva');
    var box = $('notes'); box.innerHTML = '';
    if (s.notes && s.notes.length) s.notes.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; box.appendChild(p); });
    else { var p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Sin notas para esta diapositiva.'; box.appendChild(p); }
    box.parentNode.scrollTop = 0;
    $('btnBlank').textContent = blank ? '⬜ Quitar negro' : '⬛ Pantalla negra';
    Array.prototype.forEach.call($('jump').children, function (b, i) { b.className = i === pos[0] ? 'cur' : ''; });
  }

  function setStatus() {
    var s = relay.status, dot = $('dot'), st = $('status');
    dot.className = 'dot';
    if (s === 'error') { dot.classList.add('bad'); st.textContent = 'Sin internet — reintentando'; }
    else if (s !== 'ok') { st.textContent = 'Conectando…'; }
    else if (gotState) { dot.classList.add('ok'); st.textContent = 'Conectado al iPad · sala ' + room; }
    else { st.textContent = 'Esperando al iPad (¿está abierto el visor?)'; }
  }

  function applyLocal(dir) { var b = pos.slice(); pos = SR.advance(deck, pos, dir); blank = false; render(); return b; }

  function send(dir) {
    buzz(15);
    var before = applyLocal(dir);
    relay.send({ c: dir > 0 ? 'next' : 'prev', p: before });
  }

  function onMessage(m) {
    if (m.c === 'state') {
      gotState = true;
      pos = SR.clampPos(deck, [m.i, m.k]); blank = !!m.b; render(); setStatus();
    }
  }

  function buildJump() {
    var j = $('jump'); j.innerHTML = '';
    deck.forEach(function (s, i) {
      var b = document.createElement('button'), im = document.createElement('img'), sp = document.createElement('span');
      im.src = SR.thumb(deck, i); im.loading = 'lazy'; sp.textContent = i + 1;
      b.appendChild(im); b.appendChild(sp);
      b.onclick = function () { pos = [i, 0]; blank = false; render(); relay.send({ c: 'goto', i: i, k: 0 }); $('jump').classList.remove('open'); buzz(15); };
      j.appendChild(b);
    });
  }

  function start() {
    room = SR.getRoom(location.hash.indexOf('room=') >= 0 ? location.hash.split('room=')[1] : '');
    relay = new SR.Relay(room);
    relay.onMessage = onMessage;
    relay.onStatus = setStatus;
    relay.connect();
    // pequeña espera para que la suscripción esté activa antes de saludar
    setTimeout(function () { relay.send({ c: 'hello' }); }, 700);
    setInterval(setStatus, 3000);
    SR.keepAwake();
  }

  $('btnNext').onclick = function () { send(1); };
  $('btnPrev').onclick = function () { send(-1); };
  $('btnBlank').onclick = function () { blank = !blank; render(); relay.send({ c: 'blank' }); buzz(15); };
  $('btnJump').onclick = function () { $('jump').classList.toggle('open'); };
  $('btnSync').onclick = function () { gotState = false; setStatus(); relay.send({ c: 'hello' }); };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && relay) { relay.connect(); setTimeout(function () { relay.send({ c: 'hello' }); }, 600); } });

  // Botones de volumen no existen en web; flechas por si usas teclado/clicker en el celular
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') send(1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') send(-1);
  });

  $('btnJoin').onclick = function () {
    var r = SR.setRoom($('roomInput').value);
    if (r.length < 6) { $('roomInput').focus(); return; }
    location.hash = 'room=' + r; location.reload();
  };

  SR.loadDeck().then(function (d) {
    deck = d; buildJump(); render();
    var hasRoom = location.hash.indexOf('room=') >= 0 || (function () { try { return !!localStorage.getItem('sr_room'); } catch (e) { return false; } })();
    if (!hasRoom) { $('setup').classList.add('show'); return; }
    start();
  });
})();
</script>
</body>
</html>
